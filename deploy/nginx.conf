# Load balancer in front of the API containers.
# Docker's internal DNS (127.0.0.11) returns one address per running "api" container;
# re-resolving every 5 seconds means scaling up or down needs no nginx restart.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 300m;

    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        add_header X-Upstream $upstream_addr always;
    }
}
